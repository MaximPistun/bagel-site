name: Deploy static site to Pages

on:
  push:
    branches: [ "dev" ]   # деплоим с dev
  workflow_dispatch:       # можно запускать руками из Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # в корне лежит index.html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4